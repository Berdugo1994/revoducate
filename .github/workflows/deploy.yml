# Deployment is handled from the github-pages branch.
# This file intentionally has no triggers on main.
# To deploy: rebase the github-pages branch onto main and push.
name: Deploy to GitHub Pages

on:
  workflow_dispatch: # manual trigger only from main

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push to github-pages branch to deploy."
